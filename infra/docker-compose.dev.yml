# Infra local de desenvolvimento: postgres + redis (+ evolution quando o módulo WhatsApp entrar).
# Uso: docker compose -f infra/docker-compose.dev.yml up -d
name: clinicaos-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5434 no host: 5432 (PostgreSQL nativo do Windows) e 5433 (mgdash) já estão em uso
      - "5434:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      # 6380 no host: a 6379 costuma estar ocupada por outros projetos locais
      - "6380:6379"
    volumes:
      - redis_data_dev:/data

  # Geração de PDF dos termos assinados (Chromium isolado)
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3005:3000"

  # Evolution API real (conectar um telefone de verdade).
  # Para testes automatizados use o mock: node infra/evolution-mock/server.mjs (porta 8099)
  # e rode web/worker com EVOLUTION_BASE_URL=http://localhost:8099
  evolution:
    image: atendai/evolution-api:v2.2.0        # PIN de versão — upgrade só via canário
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me-evolution-global-key}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgres://postgres:postgres@postgres:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances_dev:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data_dev:
  redis_data_dev:
  evolution_instances_dev:
