# Compose de PRODUÇÃO (VPS única). Requer .env ao lado (base: .env.production.example).
# Subida: docker compose up -d --build  ·  Migrações: ver infra/deploy.sh
name: clinicaos

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
    restart: unless-stopped
    env_file: .env
    environment:
      # Montadas AQUI (env_file não interpola ${...})
      DATABASE_URL: postgres://clinicaos_app:${DB_APP_PASSWORD:?}@postgres:5432/clinicaos
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      # Worker usa o role BYPASSRLS (re-escopa clinic_id em cada query);
      # migrator só é usado pelo `compose run worker ... migrate.ts`
      DATABASE_URL: postgres://clinicaos_app:${DB_APP_PASSWORD:?}@postgres:5432/clinicaos
      DATABASE_URL_WORKER: postgres://clinicaos_worker:${DB_WORKER_PASSWORD:?}@postgres:5432/clinicaos
      DATABASE_URL_MIGRATOR: postgres://clinicaos_migrator:${DB_MIGRATOR_PASSWORD:?}@postgres:5432/clinicaos
    volumes:
      - app_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      evolution:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD:?}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pg_wal_archive:/wal_archive
      - ./postgres-prod-init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data

  evolution:
    image: evoapicloud/evolution-api:v2.2.0 # PIN — upgrade sempre via canário
    restart: unless-stopped
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:${POSTGRES_SUPERUSER_PASSWORD:?}@postgres:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1023204200"
    expose:
      - "8080"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    expose:
      - "3000"

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET:-}
    volumes:
      - backups:/backups
      - app_storage:/data/storage:ro
      - pg_wal_archive:/wal_archive:ro
      - evolution_instances:/evolution_instances:ro
      - ./backup:/backup:ro
    entrypoint: ["/bin/sh", "/backup/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    # Acesso via túnel SSH: ssh -L 3001:localhost:3001 (porta não exposta na internet)
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - kuma_data:/app/data

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  pg_wal_archive:
  redis_data:
  app_storage:
  evolution_instances:
  backups:
  kuma_data:
